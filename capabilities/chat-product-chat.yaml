  exposes:
  - type: rest
    namespace: chat-product-chat-rest
    port: 8080
    description: REST adapter for Stream API — product:chat. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/app
      name: app
      description: REST surface for app.
      operations:
      - method: GET
        name: getapp
        description: Get App Settings
        call: chat-product-chat.getapp
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateapp
        description: Update App Settings
        call: chat-product-chat.updateapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/blocklists
      name: blocklists
      description: REST surface for blocklists.
      operations:
      - method: GET
        name: listblocklists
        description: List block lists
        call: chat-product-chat.listblocklists
        with:
          team: rest.team
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createblocklist
        description: Create block list
        call: chat-product-chat.createblocklist
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/blocklists/{name}
      name: blocklists-name
      description: REST surface for blocklists-name.
      operations:
      - method: DELETE
        name: deleteblocklist
        description: Delete block list
        call: chat-product-chat.deleteblocklist
        with:
          name: rest.name
          team: rest.team
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getblocklist
        description: Get block list
        call: chat-product-chat.getblocklist
        with:
          name: rest.name
          team: rest.team
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateblocklist
        description: Update block list
        call: chat-product-chat.updateblocklist
        with:
          name: rest.name
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
