url: https://raw.githubusercontent.com/api-evangelist/stream-io/refs/heads/main/apis.yml
name: Stream
kind: company
description: >-
  Stream provides realtime APIs for chat messaging, video and audio (calls and rooms), activity feeds and moderation.
  Hosted on a global edge network with native SDKs for web, mobile (iOS, Android, Flutter, React Native) and game
  engines (Unity, Unreal). Stream publishes full OpenAPI specifications for its Chat, Video and Moderation server-side
  APIs.
