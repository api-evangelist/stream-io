serviceCategory: Realtime Communications
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Stream Chat
  ServiceCategory: Realtime Communications
  ProviderName: Stream
  PublisherName: Stream
  InvoiceIssuerName: Stream
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingUnit: MAU
meters:
- name: monthly_active_users
  description: Unique users that opened a session in the billing month (primary meter).
  unit: user
  aggregation: distinct_count
  dimensions:
  - app_id
  - product
- name: stored_messages
  description: Total messages persisted in Stream Chat.
  unit: message
  aggregation: sum
  dimensions:
  - app_id
- name: api_calls
  description: Server-side API calls metered above plan-included quota.
  unit: request
  aggregation: sum
  dimensions:
  - app_id
  - endpoint
- name: cdn_bandwidth
  description: Bandwidth served from Stream's CDN for attachments and media.
  unit: GB
  aggregation: sum
  dimensions:
  - app_id
- name: cdn_storage
  description: Storage of attachments on Stream's CDN.
  unit: GB-month
  aggregation: avg
  dimensions:
  - app_id
- name: video_minutes
  description: Per-participant video/audio minutes for Stream Video.
  unit: minute
  aggregation: sum
  dimensions:
  - app_id
  - call_id
principles:
- name: Visibility
  description: Inspect Stream Dashboard usage tab and the monthly invoice to track MAU and usage meters.
- name: Allocation
  description: Use distinct app keys per product/team and embed cost-center IDs into user metadata for downstream allocation.
- name: Optimization
  description: Right-size MAU tier annually; archive cold messages, prune stale users, offload large attachments to your own CDN where economical.
- name: Accountability
  description: Assign per-app owners; review MAU vs. tier ceiling monthly to avoid overage.
