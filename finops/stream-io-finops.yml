description: >-
  FOCUS-aligned FinOps profile for Stream. Stream charges a tiered subscription
  per Monthly Active Users (MAU) per product (Chat, Video, Feeds, Moderation),
  plus add-on usage meters for stored messages, API call overage, and CDN
  bandwidth/storage. Billed monthly in USD; annual contracts discounted.
notes: >-
  Pricing is denominated per-MAU per-product, so cost allocation works best by
  tracking unique user IDs through Stream's app/key partitioning. Stored
  messages and CDN bytes are separately metered and visible on the invoice.
sources:
- https://getstream.io/pricing/
